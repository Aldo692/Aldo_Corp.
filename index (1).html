<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#050506">
<title>Aldo Corp.</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/favicon.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aldo Corp."><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try{if(sessionStorage.getItem('ac_splash'))document.documentElement.className='ns'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050506;--s1:#0d0d0f;--s2:#161619;--ln:#26262b;--tx:#f4f4f5;--mu:#8b8b94;--ok:#e8e8ea;--late:#ff6b5e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.lg{height:34px;width:auto;mix-blend-mode:screen;display:block}
.br{font-family:Unbounded,Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation}
#splash{position:fixed;inset:0;background:var(--bg);z-index:99;display:grid;place-items:center;text-align:center;transition:opacity .5s,visibility .5s}
.ns #splash{display:none}
#splash.off{opacity:0;visibility:hidden}
#splash img{width:min(78vw,420px);height:auto;mix-blend-mode:screen;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
#splash h1{margin:0;font:600 clamp(34px,11vw,92px)/1 Unbounded,Inter,sans-serif;letter-spacing:.06em;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
#splash small{display:block;margin-top:14px;color:var(--mu);letter-spacing:.4em;font-size:10px;animation:rise .9s .25s both}
@keyframes rise{from{opacity:0;transform:translateY(14px);letter-spacing:.3em}to{opacity:1;transform:none}}
#app{display:flex;flex-direction:column;min-height:100vh}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:22px 20px 150px}
.view{animation:fade .35s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
header .top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mu)}
header .top b{color:var(--tx);font-weight:600}
h2{margin:26px 0 4px;font:600 clamp(26px,7vw,38px)/1.15 Unbounded,Inter,sans-serif;letter-spacing:.01em}
.sub{color:var(--mu);font-size:14px;margin:0 0 18px}
.prog{height:2px;background:var(--ln);margin:6px 0 28px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--tx);width:0;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.sec{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ln);padding-bottom:8px;margin:8px 0;font-size:11px;color:var(--mu);letter-spacing:.2em;text-transform:uppercase}
.t{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--ln);animation:fade .3s both}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid #4a4a52;display:grid;place-items:center;transition:background .25s,border-color .25s,transform .15s}
.chk:active{transform:scale(.88)}
.chk svg{width:14px;height:14px;stroke:var(--bg);stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .08s}
.done .chk{background:var(--tx);border-color:var(--tx)}.done .chk svg{stroke-dashoffset:0}
.tm{flex:none;width:48px;font:500 13px Unbounded,Inter,sans-serif;color:var(--mu)}
.bd{flex:1;min-width:0}
.nm{transition:color .25s;overflow-wrap:anywhere}
.done .nm{color:var(--mu);text-decoration:line-through}
.mt{font-size:12px;color:var(--mu);display:flex;gap:10px;flex-wrap:wrap}
.late .tm,.late .mt .lt{color:var(--late)}
.ic{flex:none;width:36px;height:36px;border-radius:50%;color:var(--mu);display:grid;place-items:center;font-size:16px}
.ic:hover{background:var(--s2);color:var(--tx)}
.empty{text-align:center;padding:70px 10px;color:var(--mu)}
.empty h3{font:600 22px Unbounded,Inter,sans-serif;color:var(--tx);margin:0 0 18px}
.btn{border:1px solid var(--ln);background:var(--s1);padding:13px 22px;border-radius:999px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;transition:background .2s,transform .15s;min-height:46px}
.btn:hover{background:var(--s2)}.btn:active{transform:scale(.96)}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:500}.btn.dg{color:var(--late)}
#fab{position:fixed;right:max(20px,calc(50% - 340px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--tx);color:var(--bg);border-radius:999px;padding:0 22px 0 18px;height:52px;font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px #000a;transition:transform .15s}
#fab:active{transform:scale(.95)}#fab span{font-size:22px;line-height:1}
nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#050506ee;border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:180px;padding:14px 2px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);position:relative}
nav button.on{color:var(--tx)}nav button.on::after{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--tx)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 18px}
.wk button{border:1px solid var(--ln);border-radius:14px;padding:10px 0;text-align:center;font-size:11px;color:var(--mu);transition:all .2s;min-height:64px}
.wk button b{display:block;font:500 17px Unbounded,Inter,sans-serif;color:var(--tx);margin-top:3px}
.wk button.sel{background:var(--tx);color:var(--bg);border-color:var(--tx)}.wk button.sel b{color:var(--bg)}
.wk button.td:not(.sel){border-color:#6a6a72}
.wk i{display:block;width:4px;height:4px;border-radius:50%;background:currentColor;margin:5px auto 0;opacity:0}.wk i.y{opacity:.8}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--mu);min-height:36px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
#ov{position:fixed;inset:0;background:#000b;z-index:40;opacity:0;visibility:hidden;transition:.25s;display:flex;align-items:flex-end;justify-content:center}
#ov.on{opacity:1;visibility:visible}
.sheet{background:var(--s1);border:1px solid var(--ln);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
#ov.on .sheet{transform:none}
@media(min-width:700px){#ov{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0 0 16px;font:600 18px Unbounded,Inter,sans-serif}
label{display:block;font-size:11px;color:var(--mu);letter-spacing:.14em;text-transform:uppercase;margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;min-height:46px;outline:0;transition:border-color .2s}
input:focus,select:focus,textarea:focus,button:focus-visible{border-color:var(--tx);outline:1px solid var(--tx);outline-offset:2px}
input.err{border-color:var(--late)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dys button{border:1px solid var(--ln);border-radius:10px;padding:12px 0;font-size:11px;color:var(--mu);min-height:46px}
.dys button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sw{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.sw input{width:22px;height:22px;min-height:0;accent-color:#fff}
.act{display:flex;gap:10px;margin-top:22px}.act .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.e{background:var(--late);color:#000}
.card{border:1px solid var(--ln);border-radius:16px;padding:16px;margin:12px 0;background:var(--s1)}
.card p{margin:0 0 10px;color:var(--mu);font-size:13px}
.card .r{display:flex;gap:8px;flex-wrap:wrap}.card textarea{min-height:90px;font:12px/1.4 ui-monospace,monospace;margin-top:10px}
.cl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
@media(min-width:900px){
 nav{left:0;right:auto;top:0;bottom:0;width:200px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--ln);padding-top:60px}
 nav button{max-width:none;text-align:left;padding:14px 28px;flex:none}nav button.on::after{left:0;right:auto;top:20%;bottom:20%;width:2px;height:auto}
 #app{padding-left:200px}main{padding-bottom:90px}#fab{bottom:34px;right:max(30px,calc(50% - 160px))}#toast{bottom:40px}
}
main.wide{max-width:1040px}.rg{display:grid;gap:12px;margin-top:16px}
.rc{border:1px solid var(--ln);border-radius:16px;background:var(--s1);overflow:hidden}.rc.td{border-color:#6a6a72}
.rh{width:100%;display:flex;align-items:center;gap:12px;padding:16px;text-align:left;min-height:56px}.rh .br{font-size:13px;flex:1}.rm{font-size:12px;color:var(--mu)}.rv{width:22px;text-align:center;color:var(--mu);font-size:18px}
.rb{padding:0 16px 16px;animation:fade .25s both}.bl{font-size:13px;padding:0 4px;min-height:24px;line-height:1}
@media(min-width:900px){.rg{grid-template-columns:1fr 1fr;align-items:start}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>

const S={tasks:[],done:{},cats:['Pessoal','Saúde','Academia','Estudos','Trabalho','Casa','Outros'],set:{notif:false}};
let view='hoje',sel=today(),filt='',busy=false,db,mem=false;
/* ---------- storage ---------- */
const openDB=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('aldocorp',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const get=k=>new Promise(r=>{try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const put=(k,v)=>new Promise(r=>{try{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(JSON.parse(JSON.stringify(v)),k);t.oncomplete=()=>r(true);t.onerror=()=>r(false);t.onabort=()=>r(false)}catch(e){r(false)}});
async function save(...ks){let ok=true;for(const k of ks)ok=(await put(k,S[k]))&&ok;if(!ok&&!mem){mem=true;toast('Não foi possível salvar no aparelho',1)}if(ok)try{bc&&bc.postMessage(1)}catch(e){}return ok}
async function load(){try{db=await openDB();for(const k of Object.keys(S)){const v=await get(k);if(v!==undefined)S[k]=v}}catch(e){mem=true;toast('Armazenamento indisponível: dados só nesta sessão',1)}}
const bc=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('aldo'):null;if(bc)bc.onmessage=async()=>{await load();if(!$('#ov').classList.contains('on'))render()};
/* ---------- recorrência ---------- */
function occurs(t,s){if(s<t.start)return false;const dw=parse(s).getDay();
 if(t.rep==='none')return s===t.start;if(t.rep==='daily')return true;
 if(t.rep==='weekly')return dw===parse(t.start).getDay();
 if(t.rep==='days')return(t.days||[]).includes(dw);
 if(t.rep==='custom'){const n=Math.max(1,t.n||1);return Math.round((parse(s)-parse(t.start))/864e5)%n===0}return false}
const occ=s=>S.tasks.filter(t=>occurs(t,s)).map(t=>({t,date:s,key:t.id+'@'+s})).sort((a,b)=>a.t.time.localeCompare(b.t.time)||a.t.name.localeCompare(b.t.name));
const late=o=>!S.done[o.key]&&(o.date<today()||(o.date===today()&&o.t.time<nowHM()));
const repTxt=t=>({none:'',daily:'Todos os dias',weekly:'Toda semana',days:(t.days||[]).length===7?'Todos os dias':ORD.filter(d=>(t.days||[]).includes(d)).map(d=>DN[d]).join(' · '),custom:'A cada '+(t.n||1)+' dia(s)'})[t.rep]||'';
/* ---------- ui ---------- */
let tt;function toast(m,e){const x=$('#toast');x.textContent=m;x.className='on'+(e?' e':'');clearTimeout(tt);tt=setTimeout(()=>x.className='',2600)}
const ck='<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
function item(o,showDate){const d=!!S.done[o.key],l=late(o);return `<div class="t ${d?'done':''} ${l?'late':''}"><button class="chk" data-a="tg" data-k="${esc(o.key)}" aria-pressed="${d}" aria-label="Concluir ${esc(o.t.name)}">${ck}</button>
<div class="tm">${o.t.time}</div><div class="bd"><div class="nm">${esc(o.t.name)}</div><div class="mt">${showDate?`<span>${br(o.date)}</span>`:''}${o.t.end?`<span>até ${o.t.end}</span>`:''}${o.t.cat?`<span>${esc(o.t.cat)}</span>`:''}${o.t.rep!=='none'?`<span>↻ ${esc(repTxt(o.t))}</span>`:''}<button class="bl" data-a="bl" data-i="${o.t.id}" aria-label="Lembrete ${o.t.remind?'ativado':'desativado'}">${o.t.remind?'🔔':'🔕'}</button>${l?'<span class="lt">Atrasada</span>':''}</div></div>
<button class="ic" data-a="ed" data-i="${o.t.id}" aria-label="Editar">✎</button><button class="ic" data-a="dl" data-i="${o.t.id}" aria-label="Excluir">✕</button></div>`}
const emptyH=()=>`<div class="empty"><h3>Seu dia começa aqui</h3><button class="btn pri" data-a="nw">Adicionar primeira tarefa</button></div>`;
function vHoje(){const s=today(),L=occ(s),Dn=L.filter(o=>S.done[o.key]),P=L.filter(o=>!S.done[o.key]),n=L.filter(o=>S.done[o.key]).length,p=L.length?Math.round(n/L.length*100):0,h=new Date().getHours(),g=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite',late_=L.filter(late).length;
 return `<header><div class="top"><img class="lg" src="${LOGO}" alt="Aldo Corp."><span>${DL[new Date().getDay()]}, ${br(s)}</span></div>
<h2>${g}.</h2><p class="sub">${L.length?`${n} de ${L.length} concluída(s) hoje · ${p}%${late_?` · ${late_} atrasada(s)`:''}`:'Nenhuma tarefa para hoje.'}</p><div class="prog"><i style="width:${p}%"></i></div></header>
<div class="sec"><span>Meu dia</span><span>${P.length}</span></div>${L.length?(P.length?P.map(o=>item(o)).join(''):'<p class="sub" style="margin:16px 0">Tudo concluído por hoje. ✓</p>'):emptyH()}${Dn.length?`<div class="sec" style="margin-top:26px"><span>Concluídas hoje</span><span>${Dn.length}</span></div>${Dn.map(doneRow).join('')}`:''}`}
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const doneRow=o=>`<div class="t done"><button class="chk" data-a="tg" data-k="${esc(o.key)}" aria-pressed="true" aria-label="Desmarcar ${esc(o.t.name)}">${ck}</button><div class="tm">${o.t.time}</div><div class="bd"><div class="nm">${esc(o.t.name)}</div><div class="mt"><span>concluída às ${hm(S.done[o.key])}</span>${o.t.cat?`<span>${esc(o.t.cat)}</span>`:''}</div></div></div>`;
const rOpen={},isOpen=d=>rOpen[d]??(d===new Date().getDay());
const weekMon=()=>{const s=today();return addD(s,-((parse(s).getDay()+6)%7))};
const recIn=(t,d)=>t.rep==='daily'||(t.rep==='days'&&(t.days||[]).includes(d))||(t.rep==='weekly'&&parse(t.start).getDay()===d);
const pc=(a,b)=>b?Math.round(a/b*100):0;
function stats(){const T=today(),wm=weekMon(),by=[...Array(7)].map(()=>[0,0]),hist=[];let wd=0,wt=0,dd=0,dt=0;
 for(let i=0;i<28;i++){const s=addD(T,-i),L=occ(s),n=L.filter(o=>S.done[o.key]).length,w=parse(s).getDay();dd+=n;dt+=L.length;by[w][0]+=n;by[w][1]+=L.length;if(i<7)hist.push([s,n,L.length]);if(s>=wm){wd+=n;wt+=L.length}}
 let best=-1,bp=0;by.forEach(([n,t],d)=>{if(t&&n/t>bp){bp=n/t;best=d}});return{wd,wt,dd,dt,best,hist}}
function vRot(){const st=stats(),mon=weekMon(),td=new Date().getDay();
 const cards=ORD.map((d,i)=>{const date=addD(mon,i),L=S.tasks.filter(t=>recIn(t,d)).sort((a,b)=>a.time.localeCompare(b.time)||a.name.localeCompare(b.name)).map(t=>({t,date,key:t.id+'@'+date})),dn=L.filter(o=>S.done[o.key]).length,op=isOpen(d);
  return `<div class="rc ${d===td?'td':''}"><button class="rh" data-a="rx" data-d="${d}" aria-expanded="${op}"><span class="br">${DL[d].toUpperCase()}</span><span class="rm">${L.length} tarefa(s)${L.length?` · ${dn} ok`:''}</span><span class="rv">${op?'−':'+'}</span></button>${op?`<div class="rb">${L.length?L.map(o=>item(o)).join(''):'<p class="sub" style="margin:4px 0 0">Nenhuma tarefa neste dia.</p>'}<button class="btn" data-a="ra" data-d="${d}" style="width:100%;margin-top:12px">+ Adicionar tarefa</button></div>`:''}</div>`}).join('');
 return `<header><div class="top"><img class="lg" src="${LOGO}" alt="Aldo Corp."><span>Rotina semanal</span></div><h2>Sua semana.</h2><p class="sub">Tarefas fixas de cada dia. Elas aparecem sozinhas na aba Hoje. A conclusão vale só para o dia marcado (semana de ${br(mon).slice(0,5)}).</p></header>
<div class="card"><b>Consistência</b><p style="margin-top:6px">Esta semana: ${st.wd} de ${st.wt} concluídas (${pc(st.wd,st.wt)}%)<br>Últimos 28 dias: ${st.dd} de ${st.dt} (${pc(st.dd,st.dt)}%)${st.best>=0?`<br>Dia mais produtivo: ${DL[st.best]}`:''}</p>${st.hist.map(([s,n,t])=>`<div class="cl"><span>${DN[parse(s).getDay()]} · ${br(s).slice(0,5)}</span><span>${t?`${n}/${t}`:'—'}</span></div>`).join('')}</div>
<div class="rg">${cards}</div>`}
function vSem(){const dow=parse(sel).getDay(),mon=addD(sel,-((dow+6)%7)),days=[...Array(7)].map((_,i)=>addD(mon,i)),L=occ(sel),d=parse(sel),P=L.filter(o=>!S.done[o.key]),Dn=L.filter(o=>S.done[o.key]).sort((a,b)=>S.done[a.key]-S.done[b.key]);
 return `<header><div class="top"><img class="lg" src="${LOGO}" alt="Aldo Corp."><span>${MN[d.getMonth()]} ${d.getFullYear()}</span></div>
<div class="bar"><button class="btn" data-a="wk" data-n="-7" aria-label="Semana anterior">‹</button><button class="btn" data-a="go" data-d="${today()}">Hoje</button><button class="btn" data-a="wk" data-n="7" aria-label="Próxima semana">›</button></div></header>
<div class="wk">${days.map(x=>`<button data-a="go" data-d="${x}" class="${x===sel?'sel':''} ${x===today()?'td':''}" aria-label="${br(x)}">${DN[parse(x).getDay()]}<b>${+x.slice(8)}</b><i class="${occ(x).length?'y':''}"></i></button>`).join('')}</div>
<div class="sec"><span>${DL[dow]}, ${br(sel)}</span><span>${L.length}</span></div>${P.length?P.map(o=>item(o)).join(''):(L.length?'<p class="sub" style="margin:16px 0">Nada pendente neste dia.</p>':'<div class="empty">Nada programado para este dia.</div>')}${Dn.length?`<div class="sec" style="margin-top:26px"><span>Concluídas · histórico do dia</span><span>${Dn.length}</span></div>${Dn.map(doneRow).join('')}`:''}`}
function vTodas(){let T=[...S.tasks].filter(t=>!filt||t.cat===filt).sort((a,b)=>a.time.localeCompare(b.time)||a.name.localeCompare(b.name));
 return `<header><div class="top"><img class="lg" src="${LOGO}" alt="Aldo Corp."><span>${S.tasks.length} tarefa(s)</span></div></header><div class="chips" style="margin-top:18px"><button class="chip ${!filt?'on':''}" data-a="ft" data-c="">Todas</button>${S.cats.map(c=>`<button class="chip ${filt===c?'on':''}" data-a="ft" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
${T.length?T.map(t=>`<div class="t"><div class="tm">${t.time}</div><div class="bd"><div class="nm">${esc(t.name)}</div><div class="mt"><span>${t.rep==='none'?br(t.start):esc(repTxt(t))}</span>${t.cat?`<span>${esc(t.cat)}</span>`:''}${t.remind?'<span>🔔</span>':''}</div></div><button class="ic" data-a="ed" data-i="${t.id}" aria-label="Editar">✎</button><button class="ic" data-a="dl" data-i="${t.id}" aria-label="Excluir">✕</button></div>`).join(''):emptyH()}`}
function vAj(){const np=typeof Notification==='undefined'?'indisponível neste navegador':Notification.permission==='granted'?'permitidas':Notification.permission==='denied'?'bloqueadas no navegador':'ainda não solicitadas';
 return `<header><div class="top"><img class="lg" src="${LOGO}" alt="Aldo Corp."></div></header>
<div class="card"><b>Notificações</b><p>Status: ${np}. Os avisos disparam enquanto o app estiver aberto ou em segundo plano ativo. Com o app totalmente fechado, é preciso push com servidor (veja o README do projeto completo).</p><div class="r"><button class="btn" data-a="np">${S.set.notif?'Desativar':'Ativar'} lembretes</button></div></div>
<div class="card"><b>Categorias</b><div id="cl">${S.cats.map((c,i)=>`<div class="cl"><span>${esc(c)}</span><span><button class="ic" data-a="cr" data-i="${i}" aria-label="Renomear">✎</button><button class="ic" data-a="cd" data-i="${i}" aria-label="Remover">✕</button></span></div>`).join('')}</div><div class="r" style="margin-top:10px"><input id="nc" placeholder="Nova categoria" maxlength="24" style="flex:1"><button class="btn" data-a="ca">Adicionar</button></div></div>
<div class="card"><b>Backup (JSON)</b><p>Seus dados ficam apenas neste aparelho. Limpar dados do navegador ou perder o aparelho apaga tudo — faça backup com frequência.</p><div class="r"><button class="btn" data-a="ex">Gerar backup</button><button class="btn" data-a="im">Importar</button><label class="btn" style="margin:0;cursor:pointer">Arquivo<input type="file" id="fi" accept=".json,application/json" hidden></label></div><textarea id="bk" placeholder="O backup aparece aqui. Para importar, cole o JSON e toque em Importar." aria-label="Backup"></textarea></div>
<div class="card"><b>Zona de risco</b><p>Apaga todas as tarefas e o histórico.</p><button class="btn dg" data-a="cl">Limpar todos os dados</button></div>`}
function render(){const v={hoje:vHoje,rot:vRot,sem:vSem,todas:vTodas,aj:vAj}[view]();const m=$('#m');m.className=view==='rot'?'wide':'';m.innerHTML='<div class="view">'+v+'</div>';$('#fab').style.display=(view==='aj'||view==='rot')?'none':'flex';
 $('#nav').innerHTML=[['hoje','Hoje'],['rot','Rotina'],['sem','Semana'],['todas','Todas'],['aj','Ajustes']].map(([k,l])=>`<button data-a="nv" data-v="${k}" class="${view===k?'on':''}" ${view===k?'aria-current="page"':''}>${l}</button>`).join('')}
/* ---------- sheets ---------- */
const ov=$('#ov'),sh=$('#sh');
const openS=h=>{sh.innerHTML=h;ov.classList.add('on');setTimeout(()=>sh.querySelector('input,button')?.focus(),60)};
const closeS=()=>{ov.classList.remove('on');busy=false};
ov.addEventListener('click',e=>{if(e.target===ov)closeS()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeS()});
function confirmS(msg,fn,lbl='Excluir'){openS(`<h3>Confirmar</h3><p class="sub">${msg}</p><div class="act"><button class="btn" data-a="x">Cancelar</button><button class="btn pri" id="cf">${lbl}</button></div>`);$('#cf').onclick=async()=>{if(busy)return;busy=true;await fn();closeS()}}
function form(id,pre){const t=S.tasks.find(x=>x.id===id)||{name:'',desc:'',start:sel||today(),time:'',end:'',cat:'',rep:'none',days:[],n:2,remind:true,lead:0,...(pre||{})};
 const dsel=new Set(t.days||[]);
 openS(`<h3>${id?'Editar tarefa':'Nova tarefa'}</h3><form id="f" novalidate onsubmit="return false">
<label for="fn">Nome da atividade *</label><input id="fn" maxlength="80" value="${esc(t.name)}" placeholder="Ex.: Ir para a academia">
<label for="fd">Observações</label><textarea id="fd" rows="2">${esc(t.desc)}</textarea>
<div class="row"><div><label for="fs">Data</label><input type="date" id="fs" value="${t.start}"></div><div><label for="ft">Início *</label><input type="time" id="ft" value="${t.time}"></div><div><label for="fe">Término</label><input type="time" id="fe" value="${t.end}"></div></div>
<label for="fc">Categoria</label><select id="fc"><option value="">Sem categoria</option>${S.cats.map(c=>`<option ${c===t.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
<label for="fr">Repetição</label><select id="fr">${[['none','Não se repete'],['daily','Todos os dias'],['weekly','Toda semana'],['days','Dias específicos da semana'],['custom','Personalizado (a cada N dias)']].map(([v,l])=>`<option value="${v}" ${v===t.rep?'selected':''}>${l}</option>`).join('')}</select>
<div id="dw" style="display:none"><label>Dias</label><div class="dys">${ORD.map(d=>`<button type="button" data-d="${d}" class="${dsel.has(d)?'on':''}" aria-pressed="${dsel.has(d)}">${DN[d]}</button>`).join('')}</div></div>
<div id="cu" style="display:none"><label for="fk">Repetir a cada (dias)</label><input type="number" id="fk" min="1" max="365" value="${t.n||2}"></div>
<div class="sw"><span>Lembrete</span><input type="checkbox" id="fm" ${t.remind?'checked':''} aria-label="Lembrete"></div>
<div id="lw"><label for="fl">Avisar</label><select id="fl">${[[0,'No horário'],[5,'5 min antes'],[10,'10 min antes'],[15,'15 min antes'],[30,'30 min antes'],[60,'1 hora antes']].map(([v,l])=>`<option value="${v}" ${v==t.lead?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="act"><button type="button" class="btn" data-a="x">Cancelar</button><button type="submit" class="btn pri" id="sv">Salvar</button></div></form>`);
 const fr=$('#fr'),sync=()=>{$('#dw').style.display=fr.value==='days'?'block':'none';$('#cu').style.display=fr.value==='custom'?'block':'none';$('#lw').style.display=$('#fm').checked?'block':'none'};
 fr.onchange=sync;$('#fm').onchange=sync;sync();
 sh.querySelectorAll('.dys button').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;dsel.has(d)?dsel.delete(d):dsel.add(d);b.classList.toggle('on');b.setAttribute('aria-pressed',dsel.has(d))});
 $('#f').onsubmit=async()=>{if(busy)return;const name=$('#fn').value.trim(),time=$('#ft').value,start=$('#fs').value;let bad=0;
  [['#fn',!name],['#ft',!time],['#fs',!start]].forEach(([s,b])=>{$(s).classList.toggle('err',b);bad+=b});
  if(fr.value==='days'&&!dsel.size){toast('Selecione ao menos um dia',1);return}
  if(bad){toast('Preencha os campos obrigatórios',1);return}
  busy=true;$('#sv').disabled=true;const now=Date.now();
  const o={id:t.id||crypto.randomUUID?.()||'t'+now+Math.random().toString(36).slice(2),name,desc:$('#fd').value.trim(),start,time,end:$('#fe').value,cat:$('#fc').value,rep:fr.value,days:[...dsel],n:Math.max(1,+$('#fk').value||1),remind:$('#fm').checked,lead:+$('#fl').value,created:t.created||now,updated:now};
  if(id)S.tasks[S.tasks.findIndex(x=>x.id===id)]=o;else S.tasks.push(o);
  const ok=await save('tasks');closeS();render();if(ok)toast(id?'Tarefa atualizada':'Tarefa criada');if(o.remind)askNotif()}}
async function askNotif(){if(typeof Notification==='undefined'||Notification.permission!=='default'||S.set.asked)return;S.set.asked=1;save('set');
 openS(`<h3>Ativar lembretes?</h3><p class="sub">Para avisar você no horário das tarefas, o navegador precisa da sua permissão de notificações. Você pode recusar e continuar usando o app normalmente.</p><div class="act"><button class="btn" data-a="x">Agora não</button><button class="btn pri" id="pm">Permitir</button></div>`);
 $('#pm').onclick=async()=>{closeS();await enNotif()}}
async function enNotif(){try{const p=await Notification.requestPermission();S.set.notif=p==='granted';await save('set');toast(p==='granted'?'Lembretes ativados':'Permissão negada — o app segue funcionando',p!=='granted')}catch(e){toast('Notificações indisponíveis aqui',1)}if(view==='aj')render()}
/* ---------- ações ---------- */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,D=b.dataset;
 if(a==='nv'){view=D.v;if(view==='sem')sel=today();render();scrollTo(0,0)}
 else if(a==='tg'){if(S.done[D.k])delete S.done[D.k];else S.done[D.k]=Date.now();await save('done');render()}
 else if(a==='nw')form();else if(a==='ed')form(D.i);else if(a==='x')closeS();else if(a==='ra')form(null,{rep:'days',days:[+D.d],start:today()});else if(a==='rx'){rOpen[D.d]=!isOpen(+D.d);render()}else if(a==='bl'){const t=S.tasks.find(x=>x.id===D.i);t.remind=!t.remind;t.updated=Date.now();await save('tasks');render();if(t.remind)askNotif()}
 else if(a==='dl'){const t=S.tasks.find(x=>x.id===D.i);confirmS(`Excluir “${esc(t.name)}”${t.rep!=='none'?' e todas as suas repetições':''}?`,async()=>{S.tasks=S.tasks.filter(x=>x.id!==D.i);for(const k in S.done)if(k.startsWith(D.i+'@'))delete S.done[k];await save('tasks','done');render();toast('Tarefa excluída')})}
 else if(a==='wk'){sel=addD(sel,+D.n);render()}else if(a==='go'){sel=D.d;render()}
 else if(a==='ft'){filt=D.c;render()}
 else if(a==='np'){if(S.set.notif){S.set.notif=false;await save('set');render()}else if(typeof Notification==='undefined')toast('Notificações indisponíveis neste navegador',1);else if(Notification.permission==='denied')toast('Bloqueadas: libere nas configurações do navegador',1);else await enNotif()}
 else if(a==='ca'){const v=$('#nc').value.trim();if(!v)return;if(S.cats.some(c=>c.toLowerCase()===v.toLowerCase())){toast('Categoria já existe',1);return}S.cats.push(v);await save('cats');render()}
 else if(a==='cd'){const c=S.cats[D.i];confirmS(`Remover a categoria “${esc(c)}”?`,async()=>{S.cats.splice(D.i,1);S.tasks.forEach(t=>{if(t.cat===c)t.cat=''});await save('cats','tasks');render()},'Remover')}
 else if(a==='cr'){const i=+D.i,old=S.cats[i];openS(`<h3>Renomear categoria</h3><input id="rn" maxlength="24" value="${esc(old)}"><div class="act"><button class="btn" data-a="x">Cancelar</button><button class="btn pri" id="rk">Salvar</button></div>`);$('#rk').onclick=async()=>{const v=$('#rn').value.trim();if(!v)return;S.cats[i]=v;S.tasks.forEach(t=>{if(t.cat===old)t.cat=v});await save('cats','tasks');closeS();render()}}
 else if(a==='ex'){const j=JSON.stringify({app:'aldo-corp',v:1,tasks:S.tasks,done:S.done,cats:S.cats},null,1);$('#bk').value=j;try{await navigator.clipboard.writeText(j);toast('Backup copiado — cole em um arquivo seguro')}catch(_){toast('Backup gerado: copie o texto abaixo')}}
 else if(a==='im')importJ($('#bk').value)
 else if(a==='cl')confirmS('Isso apaga todas as tarefas e o histórico. Não pode ser desfeito.',async()=>{S.tasks=[];S.done={};await save('tasks','done');render();toast('Dados apagados')},'Apagar tudo')});
document.addEventListener('change',e=>{if(e.target.id==='fi'){const f=e.target.files[0];if(f)f.text().then(importJ)}});
function importJ(txt){let j;try{j=JSON.parse(txt)}catch(e){toast('JSON inválido',1);return}
 const okT=t=>t&&typeof t.id==='string'&&typeof t.name==='string'&&/^\d{4}-\d\d-\d\d$/.test(t.start)&&/^\d\d:\d\d$/.test(t.time)&&['none','daily','weekly','days','custom'].includes(t.rep);
 if(j.app!=='aldo-corp'||!Array.isArray(j.tasks)||!j.tasks.every(okT)||typeof j.done!=='object'||!Array.isArray(j.cats)){toast('Arquivo não é um backup válido do Aldo Corp.',1);return}
 confirmS(`Importar ${j.tasks.length} tarefa(s)? Os dados atuais serão substituídos.`,async()=>{S.tasks=j.tasks;S.done=j.done;S.cats=j.cats.map(String);await save('tasks','done','cats');render();toast('Backup importado')},'Importar')}
$('#fab').onclick=()=>form();
/* ---------- lembretes (app aberto) ---------- */
const fired=new Set();
function tick(){if(!S.set.notif||typeof Notification==='undefined'||Notification.permission!=='granted')return;const d=new Date(),s=ymd(d),cur=d.getHours()*60+d.getMinutes();
 occ(s).forEach(o=>{if(!o.t.remind||S.done[o.key])return;const[h,m]=o.t.time.split(':').map(Number),at=h*60+m-(o.t.lead||0);
  if(cur>=at&&cur<at+10&&!fired.has(o.key)){fired.add(o.key);const bd=`${o.t.lead?`Começa em ${o.t.lead} min: `:'Está na hora: '}${o.t.name} (${o.t.time})`,op={body:bd,tag:o.key,icon:'./icons/icon-192.png'};
   const fb=()=>{try{new Notification('Aldo Corp.',op)}catch(e){}};
   if(navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification('Aldo Corp.',op)).catch(fb);else fb()}})}
let curDay=today();
function dayCheck(){const t=today();if(t!==curDay){if(sel===curDay)sel=t;curDay=t;fired.clear();render()}}
const beat=()=>{dayCheck();tick();if(view==='hoje'&&!ov.classList.contains('on'))render()};
setInterval(beat,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)beat()});addEventListener('focus',beat);
/* ---------- init ---------- */
try{sessionStorage.setItem('ac_splash','1')}catch(e){}
(async()=>{await load();render();setTimeout(()=>$('#splash').classList.add('off'),1300);tick()})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
